<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Ekramul Islam - Portfolio</title>
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Snow effect container */
        #snowflake-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #cbd5e1;
            font-size: 1em;
            pointer-events: none;
            animation: fall linear infinite;
            opacity: 0.7;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) translateX(50px);
                opacity: 0.2;
            }
        }

        .portfolio-container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            position: relative;
            z-index: 2;
        }

        /* 5. Image size increased to 160px */
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ffffff;
            box-shadow: 0 8px 24px rgba(14, 165, 233, 0.2);
            margin-bottom: 25px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .profile-img:hover {
            transform: scale(1.08) rotate(3deg);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            color: #0f172a;
        }

        .username {
            font-size: 14px;
            color: #0ea5e9;
            margin-bottom: 20px;
            font-weight: 600;
            background: rgba(14, 165, 233, 0.1);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Description / Bio */
        .bio-section {
            background: rgba(241, 245, 249, 0.9);
            padding: 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            color: #475569;
            margin-bottom: 30px;
            text-align: left;
            border-left: 4px solid #0ea5e9;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .bio-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .bio-item:last-child {
            margin-bottom: 0;
        }

        .bio-item i {
            margin-right: 12px;
            color: #0ea5e9;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* Index / Links List */
        .links-title {
            font-size: 14px;
            text-align: left;
            margin-bottom: 15px;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Fancy Hover & Buttons Base Setup */
        .link-item {
            display: flex;
            align-items: center;
            background: #ffffff;
            padding: 16px 22px;
            border-radius: 16px;
            text-decoration: none;
            color: #334155;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(148, 163, 184, 0.15);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .link-item i.brand-icon {
            font-size: 22px;
            margin-right: 15px;
            transition: transform 0.3s ease;
        }

        .link-item .link-text {
            flex-grow: 1;
            text-align: left;
            font-size: 15px;
        }

        .link-item i.arrow-icon {
            font-size: 12px;
            opacity: 0.4;
            transition: transform 0.3s ease;
        }

        /* Fancy Hover Effects */
        .link-item:hover {
            transform: translateY(-4px) scale(1.02);
            color: #ffffff !important;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
        }

        .link-item:hover i.brand-icon {
            transform: scale(1.2) rotate(-8deg);
        }

        .link-item:hover i.arrow-icon {
            transform: translateX(5px);
            opacity: 1;
        }

        /* Dynamic Colors on Hover */
        .link-item.facebook:hover { background: #1877f2; border-color: #1877f2; box-shadow: 0 8px 20px rgba(24, 119, 242, 0.35); }
        .link-item.fb-page:hover { background: #0084ff; border-color: #0084ff; box-shadow: 0 8px 20px rgba(0, 132, 255, 0.35); }
        .link-item.youtube:hover { background: #ff0000; border-color: #ff0000; box-shadow: 0 8px 20px rgba(255, 0, 0, 0.35); }
        .link-item.gmail:hover { background: #ea4335; border-color: #ea4335; box-shadow: 0 8px 20px rgba(234, 67, 53, 0.35); }

        /* Icon Individual Colors (Before Hover) */
        .facebook i.brand-icon { color: #1877f2; }
        .fb-page i.brand-icon { color: #0084ff; }
        .youtube i.brand-icon { color: #ff0000; }
        .gmail i.brand-icon { color: #ea4335; }
    </style>
</head>
<body>

    <!-- Snow Effect Background Container -->
    <div id="snowflake-container"></div>

    <div class="portfolio-container">
        <!-- ১. সবার শুরুতে মাঝে বড় ছবি -->
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhfnbtFFm9Sn_tc23-BpkQHoEqcJSWMOrseYbOEs5yn6vWNSmlBNXHYvi4i65yE_dOq3gPMN9HcYmrzy1LfzpiOAMNosJehSlJmx9QCzckjYM-uICcOH5ec5ecmMQWjUcIzNE9-ji9ng_qYkF3XvwvZOvp9g4v38B4iCct1d1AB2zbZArtEsXKOQghXxHHy/s3264/7188.png" alt="MD Ekramul Islam" class="profile-img">

        <!-- ২. নিচে নাম এবং ইউজারনেম -->
        <h1>MD Ekramul Islam</h1>
        <div class="username">@7878Ekra</div>

        <!-- ৩. সংক্ষেপে পরিচয় (Bootstrap Icons used) -->
        <div class="bio-section">
            <div class="bio-item">
                <i class="bi bi-mortarboard-fill"></i>
                B.Sc. (Honours) in Physics
            </div>
            <div class="bio-item">
                <i class="bi bi-building-fill"></i>
                Sirajganj Govt. College
            </div>
            <div class="bio-item">
                <i class="bi bi-envelope-at-fill"></i>
                7878Ekra@gmail.com
            </div>
            <div class="bio-item">
                <i class="bi bi-hourglass-split"></i>
                Too busy working on my own future.💌
            </div>
        </div>

        <!-- ৪. Index এর মতো লোগো এবং লিঙ্ক -->
        <div class="links-title">Connect with me</div>
        <div class="links-list">
            
            <!-- Facebook Profile Link -->
            <div class="link-item facebook" onclick="openDoubleLink('fb://facewebmodal/fblink?path=https://www.facebook.com/7878ekra.id', 'https://www.facebook.com/7878ekra.id')">
                <i class="bi bi-facebook brand-icon"></i>
                <span class="link-text">Facebook Profile</span>
                <i class="bi bi-chevron-right arrow-icon"></i>
            </div>

            <!-- Facebook Page Link -->
            <div class="link-item fb-page" onclick="openDoubleLink('fb://page/YOUR_PAGE_ID_HERE', 'https://www.facebook.com/7878ekra.page')">
                <i class="bi bi-flag-fill brand-icon"></i>
                <span class="link-text">Facebook Page</span>
                <i class="bi bi-chevron-right arrow-icon"></i>
            </div>

            <!-- YouTube Link -->
            <div class="link-item youtube" onclick="openDoubleLink('vnd.youtube://www.youtube.com/@7878ekra', 'https://youtube.com/@7878ekra')">
                <i class="bi bi-youtube brand-icon"></i>
                <span class="link-text">YouTube Channel</span>
                <i class="bi bi-chevron-right arrow-icon"></i>
            </div>

            <!-- Gmail/Mailto Link -->
            <div class="link-item gmail" onclick="openDoubleLink('mailto:7878Ekra@gmail.com', 'mailto:7878Ekra@gmail.com')">
                <i class="bi bi-envelope-fill brand-icon"></i>
                <span class="link-text">Email Me (Gmail)</span>
                <i class="bi bi-chevron-right arrow-icon"></i>
            </div>

        </div>
    </div>

    <script>
        // ৫. মোবাইল অ্যাপ এবং ব্রাউজার ইউআরএল একসাথে হ্যান্ডেল করার ফাংশন
        function openDoubleLink(appUrl, webUrl) {
            window.location.href = appUrl;
            setTimeout(function() {
                window.open(webUrl, '_blank');
            }, 500);
        }

        // ৬. হালকা হালকা স্নো বা বরফ পড়ার লাইভ জাভাস্ক্রিপ্ট কোড
        function createSnowflakes() {
            const container = document.getElementById('snowflake-container');
            const snowflakeSymbols = ['•', '❄', '❅', '❆']; // বিভিন্ন টাইপের স্নো কণা
            const maxSnowflakes = 40; // স্ক্রিনে একবারে সর্বোচ্চ কয়টি তুষারকণা থাকবে

            for (let i = 0; i < maxSnowflakes; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                
                // র্যান্ডম স্টাইল জেনারেট করা
                snowflake.textContent = snowflakeSymbols[Math.floor(Math.random() * snowflakeSymbols.length)];
                snowflake.style.left = Math.random() * 100 + 'vw';
                snowflake.style.animationDuration = (Math.random() * 4 + 6) + 's'; // পড়ার গতি (৬ থেকে ১০ সেকেন্ড)
                snowflake.style.animationDelay = (Math.random() * 5) + 's';
                snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px'; // সাইজ ছোট বড় করা
                
                container.appendChild(snowflake);
            }
        }

        // পেজ লোড হওয়ার পর স্নো ইফেক্ট চালু হবে
        window.addEventListener('DOMContentLoaded', createSnowflakes);
    </script>

</body>
</html>
